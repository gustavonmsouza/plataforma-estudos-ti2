<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TI2 - Front End | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #093070 0%, #1b4b91 60%, #ff7645 150%);
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      margin: 2rem auto;
    }
    .login-card {
      border: none;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);
    }
    .login-card .card-header {
      background-color: #093070;
      color: #fff;
      text-align: center;
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: none;
    }
    .login-card .card-header .bi {
      font-size: 2.5rem;
    }
    .login-card .card-body {
      padding: 2rem 1.5rem;
    }
    .btn-login {
      background-color: #093070;
      border-color: #093070;
    }
    .btn-login:hover {
      background-color: #ff7645;
      border-color: #ff7645;
    }
    .voltar-home {
      display: block;
      text-align: center;
      color: #fff;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .voltar-home:hover {
      color: #ffe0d3;
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <a href="../../index.html" class="voltar-home">&larr; Voltar para a home</a>
    <div class="card login-card">
      <div class="card-header">
        <i class="bi bi-person-circle"></i>
        <h3 class="mb-0 mt-2">Identificação de Usuário</h3>
      </div>
      <div class="card-body">
        <form id="login-form" class="form">
          <div class="form-floating mb-3">
            <input type="text" name="username" id="username" class="form-control" placeholder="Login" autocomplete="username" required>
            <label for="username">Login</label>
          </div>
          <div class="form-floating mb-4">
            <input type="password" name="password" id="password" class="form-control" placeholder="Senha" autocomplete="current-password" required>
            <label for="password">Senha</label>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-login btn-lg text-light">Login</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#loginModal">Criar nova conta</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal de cadastro de novo usuário -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header text-light" style="background-color: #093070;">
          <h5 class="modal-title" id="loginModalLabel"><i class="bi bi-person-plus"></i> Novo usuário</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <form id="register-form" class="form">
            <div class="form-floating mb-3">
              <input type="text" name="txt_login" id="txt_login" class="form-control" placeholder="Usuário" required>
              <label for="txt_login">Usuário</label>
            </div>
            <div class="form-floating mb-3">
              <input type="text" name="txt_nome" id="txt_nome" class="form-control" placeholder="Nome completo" required>
              <label for="txt_nome">Nome completo</label>
            </div>
            <div class="form-floating mb-3">
              <input type="email" name="txt_email" id="txt_email" class="form-control" placeholder="E-mail" required>
              <label for="txt_email">E-mail</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" name="txt_senha" id="txt_senha" class="form-control" placeholder="Senha" required>
              <label for="txt_senha">Senha</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" name="txt_senha2" id="txt_senha2" class="form-control" placeholder="Confirmação de senha" required>
              <label for="txt_senha2">Confirmação de senha</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn_salvar" class="btn btn-login text-light">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/login.js"></script>
  <script>

    // Declara uma função para processar o formulário de login
    function processaFormLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados de login e senha a partir do formulário de login
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      // Valida login e se estiver ok, redireciona para tela inicial da aplicação
      resultadoLogin = loginUser(username, password);
      if (resultadoLogin) {
        window.location.href = RETURN_URL;
      }
      else { // Se login falhou, avisa ao usuário
        alert('Usuário ou senha incorretos');
      }
    }

    function salvaLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados do formulário
      let login = document.getElementById('txt_login').value;
      let nome = document.getElementById('txt_nome').value;
      let email = document.getElementById('txt_email').value;
      let senha = document.getElementById('txt_senha').value;
      let senha2 = document.getElementById('txt_senha2').value;
      if (senha != senha2) {
        alert('As senhas informadas não conferem.');
        return
      }

      // Adiciona o usuário no banco de dados
      addUser(nome, login, senha, email);
      alert('Usuário salvo com sucesso. Proceda com o login para continuar.');

      // Oculta a div modal do login
      bootstrap.Modal.getOrCreateInstance(document.getElementById('loginModal')).hide();
    }

    // Associa a funçao processaFormLogin ao formulário de login
    document.getElementById('login-form').addEventListener('submit', processaFormLogin);

    // Associar salvamento ao botao
    document.getElementById('btn_salvar').addEventListener('click', salvaLogin);
  </script>
</body>

</html>
